server:
  port: 8081
spring:
  application:
    name: "Auth"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "registerUser"
    schema: "public"
    username: "postgres"
    password: "1234"
routes:
    paths:
      signUp: "/api/v1/signUp"
      login: "/api/v1/login"
      usersByEmail: "/api/v1/login/{email}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
jwt:
  secret: "4v+9du6Vl3qZrYfLJe6A2P2QYb3B8FgcpzNEkZw1ySA="
  expiration: 360000
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
springdoc:
  api-docs:
    enabled: true
    path: "/v3/api-docs"
  swagger-ui:
    enabled: true
    path: "/swagger-ui.html"