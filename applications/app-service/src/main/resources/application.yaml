server:
  port: 8080
spring:
  application:
    name: "Auth"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "registerUser"
    schema: "public"
    username: "postgres"
    password: "1234"
routes:
    paths:
      users: "/api/v1/users"
      usersByEmail: "/api/v1/users/{email}"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
